<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمة التوصيل السريع</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(18, 24, 38, 0.75);
            --card-border: rgba(255, 0, 127, 0.25);
            --primary-neon: #ff007f;
            --primary-glow: rgba(255, 0, 127, 0.4);
            --secondary-neon: #00f0ff;
            --secondary-glow: rgba(0, 240, 255, 0.3);
            --accent-gold: #ffd700;
            --whatsapp-color: #25d366;
            --whatsapp-glow: rgba(37, 211, 102, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 35px 35px;
            z-index: -2;
        }

        .glow-orb-1 {
            position: fixed;
            top: -10%;
            right: -10%;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            z-index: -1;
            filter: blur(60px);
            animation: pulse 8s infinite alternate;
        }

        .glow-orb-2 {
            position: fixed;
            bottom: -10%;
            left: -10%;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, var(--secondary-glow) 0%, transparent 70%);
            z-index: -1;
            filter: blur(60px);
            animation: pulse 10s infinite alternate-reverse;
        }

        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.2) translate(30px, -30px); }
        }

        header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(11, 15, 25, 0.7);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #fff;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .logo-title {
            font-weight: 900;
            font-size: 22px;
            background: linear-gradient(90deg, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .admin-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-btn:hover {
            color: var(--text-main);
            border-color: var(--primary-neon);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .main-container {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
            flex: 1;
        }

        .hero-banner {
            text-align: center;
            margin-bottom: 35px;
            position: relative;
        }

        .hero-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .hero-title span {
            background: linear-gradient(90deg, var(--primary-neon), var(--secondary-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            color: var(--text-muted);
            font-size: 15px;
        }

        .ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
        }

        .ornament-line {
            height: 1px;
            width: 60px;
            background: linear-gradient(90deg, transparent, var(--primary-neon), transparent);
        }

        .ornament-diamond {
            color: var(--accent-gold);
            font-size: 12px;
        }

        .order-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 0, 127, 0.05);
            position: relative;
            overflow: hidden;
        }

        .order-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-neon), var(--secondary-neon), var(--accent-gold));
        }

        .instruction-box {
            background: rgba(255, 0, 127, 0.08);
            border: 1px dashed var(--primary-neon);
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #fff;
            font-weight: 700;
            font-size: 17px;
        }

        .instruction-box i {
            color: var(--accent-gold);
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-main);
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 14px 16px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--secondary-neon);
            box-shadow: 0 0 12px var(--secondary-glow);
            background: rgba(0, 0, 0, 0.5);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 140px;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 10px 25px var(--whatsapp-glow);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px var(--whatsapp-glow);
            filter: brightness(1.1);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            left: 15px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #fff;
            text-align: center;
        }

        .order-history-list {
            max-height: 250px;
            overflow-y: auto;
            margin-top: 15px;
        }

        .history-item {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .history-item-date {
            color: var(--text-muted);
            font-size: 11px;
            margin-bottom: 5px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 13px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(11, 15, 25, 0.8);
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="glow-orb-1"></div>
    <div class="glow-orb-2"></div>

    <header>
        <div class="logo-container">
            <div class="logo-icon">
                <i class="fa-solid fa-truck-fast"></i>
            </div>
            <div class="logo-title">خدمة التوصيل السريع</div>
        </div>
        <button class="admin-btn" onclick="openAdminModal()">
            <i class="fa-solid fa-user-shield"></i>
            لوحة المالك
        </button>
    </header>

    <main class="main-container">
        <div class="hero-banner">
            <h1 class="hero-title">توصيل <span>أينما كنت</span></h1>
            <div class="ornament">
                <div class="ornament-line"></div>
                <i class="fa-solid fa-star ornament-diamond"></i>
                <div class="ornament-line"></div>
            </div>
            <p class="hero-subtitle">أدخل تفاصيل طلبك وعنوانك وسنتكفل بالباقي فوراً</p>
        </div>

        <div class="order-card">
            <div class="instruction-box">
                <i class="fa-solid fa-location-dot"></i>
                <span>اكتب عنوانك مع طلبك</span>
            </div>

            <form id="deliveryForm" onsubmit="sendOrder(event)">
                <div class="form-group">
                    <label class="form-label">تفاصيل الطلب والعنوان الكامل</label>
                    <textarea class="form-control" id="orderDetails" required placeholder="أدخل المكان والطلب هنا..."></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    <i class="fa-brands fa-whatsapp"></i>
                    إرسال الطلب عبر الواتساب
                </button>
            </form>
        </div>
    </main>

    <!-- Modal Admin Auth -->
    <div class="modal-overlay" id="authModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('authModal')"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="modal-title">تسجيل دخول المالك</h3>
            <form onsubmit="verifyAdmin(event)">
                <div class="form-group">
                    <label class="form-label">كلمة المرور</label>
                    <input type="password" class="form-control" id="adminPassInput" required>
                </div>
                <button type="submit" class="submit-btn" style="background: linear-gradient(135deg, var(--primary-neon), #b30059);">دخول</button>
            </form>
        </div>
    </div>

    <!-- Modal Admin Dashboard -->
    <div class="modal-overlay" id="dashboardModal">
        <div class="modal-content" style="max-width: 550px;">
            <button class="modal-close" onclick="closeModal('dashboardModal')"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="modal-title">لوحة إعدادات المالك</h3>
            
            <div class="form-group">
                <label class="form-label">رقم الواتساب الرسمي (بدون +)</label>
                <input type="text" class="form-control" id="whatsappNumberInput">
            </div>

            <button onclick="saveSettings()" class="submit-btn" style="background: linear-gradient(135deg, var(--secondary-neon), #008cb3); margin-bottom: 20px;">حفظ الإعدادات</button>

            <h4 style="color: #fff; margin-bottom: 10px; font-size: 15px;">سجل الطلبات الأخير</h4>
            <div class="order-history-list" id="orderHistoryList">
                <div style="color: var(--text-muted); text-align: center; padding: 20px;">لا توجد طلبات مسجلة بعد</div>
            </div>
        </div>
    </div>

    <footer>
        جميع الحقوق محفوظة &copy; 2026 - غزال عبدالرزاق للبرمجة
    </footer>

    <script>
        let officialWhatsapp = localStorage.getItem('delivery_whatsapp') || '213696536281';
        let adminPassword = localStorage.getItem('delivery_admin_pass') || 'admin123';
        let ordersHistory = JSON.parse(localStorage.getItem('delivery_orders_history') || '[]');

        function sendOrder(e) {
            e.preventDefault();
            const details = document.getElementById('orderDetails').value.trim();
            if (!details) return;

            const newOrder = {
                details: details,
                date: new Date().toLocaleString('ar-EG')
            };

            ordersHistory.unshift(newOrder);
            localStorage.setItem('delivery_orders_history', JSON.stringify(ordersHistory));

            const encodedText = encodeURIComponent(`السلام عليكم، أرغب بالتوصيل:\n\n${details}`);
            const whatsappUrl = `https://wa.me/${officialWhatsapp}?text=${encodedText}`;

            window.open(whatsappUrl, '_blank');
            document.getElementById('orderDetails').value = '';
        }

        function openAdminModal() {
            document.getElementById('authModal').classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function verifyAdmin(e) {
            e.preventDefault();
            const inputPass = document.getElementById('adminPassInput').value;
            if (inputPass === adminPassword) {
                closeModal('authModal');
                document.getElementById('adminPassInput').value = '';
                openDashboard();
            } else {
                alert('كلمة المرور غير صحيحة');
            }
        }

        function openDashboard() {
            document.getElementById('whatsappNumberInput').value = officialWhatsapp;
            renderHistory();
            document.getElementById('dashboardModal').classList.add('active');
        }

        function saveSettings() {
            const num = document.getElementById('whatsappNumberInput').value.trim();
            if (num) {
                officialWhatsapp = num;
                localStorage.setItem('delivery_whatsapp', officialWhatsapp);
                alert('تم حفظ الإعدادات بنجاح');
                closeModal('dashboardModal');
            }
        }

        function renderHistory() {
            const list = document.getElementById('orderHistoryList');
            if (ordersHistory.length === 0) {
                list.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 20px;">لا توجد طلبات مسجلة بعد</div>';
                return;
            }

            list.innerHTML = ordersHistory.map(o => `
                <div class="history-item">
                    <div class="history-item-date">${o.date}</div>
                    <div style="color: #fff;">${o.details}</div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
